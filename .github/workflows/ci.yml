name: Ecommerce Platform CI

on:
  push:
    branches:
      - main
      - devops-completion
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api-gateway/package-lock.json
            product-service/package-lock.json
            inventory-service/package.json
            order-service/package-lock.json

      - name: Install API Gateway dependencies
        working-directory: api-gateway
        run: npm ci

      - name: Install Product Service dependencies
        working-directory: product-service
        run: npm ci

      - name: Install Inventory Service dependencies
        working-directory: inventory-service
        run: npm install

      - name: Install Order Service dependencies
        working-directory: order-service
        run: npm ci

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for gateway
        run: |
          for i in {1..36}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: End-to-end smoke test
        run: bash scripts/smoke-test.sh

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shut down stack
        if: always()
        run: docker compose down -v
